# dsh-plugin-wechat-session 通道外设版（v2.2.2）的 profile 挂载层。
#
# 一个包只挂一条 loader 行——本插件自己。v2.0.0 起不再是聚合包：
#   - 不再挂载 dsh-im 微信机器人包，顶层 dependencies 也已移除。
#   - 微信协议由插件内置的纯 Node iLink 适配器承担（lib/channel/ilink.mjs），
#     扫码登录即可，无需填写 Bot ID / 目标 ID。
#
# 覆盖方式：profile 里同名 id 的行会「整份替换」下面的 config（不做深合并），
# index.js 的 apply 对每个缺省 key 都有同样的默认值兜底，可按需只覆盖其中几项。
# 更推荐在插件设置页里改配置（设置页写入 localStorage，优先级高于这里的兜底值）。
- insert:
    - id: dsh-plugin-wechat-session
      name: 'dsh-plugin-wechat-session'
      config:
        # 会话短前缀长度（审批/选择题回填码 / 入站指令寻址用，默认 6）
        prefixLength: 6
        # 回填硬超时毫秒；富格式卡在浮层超时后才发到微信，留足回填窗口（默认 300000=5分钟）
        approvalTimeoutMs: 300000
        # 审批等待期间每隔多少毫秒发一次微信提醒卡（默认 60000）
        remindIntervalMs: 60000
        # 最多发几次提醒卡，达到后按 permissionPreset 结算（默认 3）
        maxReminders: 3
        # 超时降级策略：ask（取消）| allow-once（批准一次）| reject（拒绝）
        permissionPreset: 'ask'
        # 选择题硬超时毫秒；0 = 取 approvalTimeoutMs
        questionTimeoutMs: 0
        # 定时未决汇总间隔毫秒；0 = 关闭（默认 0）
        summaryIntervalMs: 0
        # /new 新建会话标题（缺省「微信 · Clawbot」）；工作目录在设置页配置并持久化到 settings.json
        newSessionTitle: '微信 · Clawbot'
